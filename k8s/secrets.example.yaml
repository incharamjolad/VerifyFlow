# Do NOT put real values here. Create the real secret with kubectl (see guide):
# kubectl create secret generic verifyflow-secrets --from-literal=MONGODB_URI=... --from-literal=JWT_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: verifyflow-secrets
type: Opaque
stringData:
  MONGODB_URI: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
